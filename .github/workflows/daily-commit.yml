name: Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"    # 12:00 AM UTC
    - cron: "0 6 * * *"    # 6:00 AM UTC
    - cron: "0 12 * * *"   # 12:00 PM UTC
    - cron: "0 18 * * *"   # 6:00 PM UTC
  workflow_dispatch:        # Allows manual testing via the Actions tab

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "$(date)" >> daily-commit.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-commit.txt
          git commit -m "Daily update: $(date -u)" || exit 0
          git push
